<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Congratulations!</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="icon" href="favicon.png">
    <!-- head-end -->
  </head>
  <body>
    <header>
    </header>
    <main>
        <section class="text-container">
            <img class="object-icon" src="./images/success-icon.svg" alt="Success Image" style="
            width: 100%;
            height: 80px;
            position: relative;
            max-width: 100%;
            overflow: hidden;
            flex-shrink: 0;
            margin-top: 120px;
            "
            >
        <h3 style=
        "width: 100%;
        position: relative;
        display: inline-block;
        text-align: center;"
        >Congratulations!</h3>
        <p style="
            width: 100%;
            position: relative;
            text-align: center;
            display: inline-block;">You’re such a wonderful explorer. Keep going with other locations.</p>
        </section>

        <ul id="buttons" style="width: 100%; list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 20px;">
            <button id="next-question-button" class="primary-button">
                Next Question
            </button>

            <button onclick="location.href='index.html'" class="secondary-button">
                Explore other locations
            </button>
        </ul>
    </main>
    <script>
        window.addEventListener("load", () => {

            const sound = new Audio("./sounds/correct_answer.mp3");
            sound.play();

            const params = new URLSearchParams(window.location.search);

            const page = params.get("page");
            const q = Number(params.get("q"));

            const nextButton = document.getElementById("next-question-button");

            if (nextButton) {

                if (q === 10) {

                    nextButton.textContent = "Complete Journey";

                    nextButton.addEventListener("click", () => {
                        window.location.href = "journey-completed.html";
                    });

                } else {

                    nextButton.addEventListener("click", () => {
                        window.location.href = `${page}?q=${q + 1}`;
                    });

                }
            }
        });
        </script>
    </body>
    </html>
