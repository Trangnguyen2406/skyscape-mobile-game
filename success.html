<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Congratulations!</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="icon" href="favicon.png">
    <!-- head-end -->
  </head>
  <body>
    <header>
    </header>
    <main>
        <section class="text-container">
            <img class="object-icon" src="./images/success-icon.svg" alt="Success Image" style="
            width: 100%;
            height: 80px;
            position: relative;
            max-width: 100%;
            overflow: hidden;
            flex-shrink: 0;
            margin-top: 120px;
            "
            >
        <h3 style=
        "width: 100%;
        position: relative;
        display: inline-block;
        text-align: center;"
        >Congratulations!</h3>
        <p style="
            width: 100%;
            position: relative;
            text-align: center;
            display: inline-block;">You’re such a wonderful explorer. Keep going with other locations.</p>
        </section>

        <ul id="buttons" style="width: 100%; list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 20px;">
            <button id="next-question-button" class="primary-button">
                Next Question
            </button>

            <button id="explore-button" class="secondary-button">
                Explore other locations
            </button>
        </ul>
    </main>
            <script>
        window.addEventListener("load", () => {
            const sound = new Audio("./sounds/correct_answer.mp3");
            sound.play().catch(() => {});

            const params = new URLSearchParams(window.location.search);
            const page = params.get("page");
            const nextQ = params.get("nextQ");
            const station = params.get("station");

            const nextBtn = document.getElementById("next-question-button");
            const exploreBtn = document.getElementById("explore-button");

            // "Next Question" jumps to the next uncompleted question
            if (nextBtn) {
                if (nextQ) {
                    nextBtn.addEventListener("click", () => {
                        if (page) window.location.href = `${page}?q=${nextQ}`;
                    });
                } else {
                    nextBtn.style.display = "none";
                }
            }

            // "Explore other locations" returns to the station checklist
            if (exploreBtn) {
                exploreBtn.addEventListener("click", () => {
                    if (station) window.location.href = station;
                });
            }
        });
    </script>


    </body>
    </html>
