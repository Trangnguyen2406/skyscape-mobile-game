<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Journey Completed</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="icon" href="favicon.png">
    <!-- head-end -->
  </head>
  <body>
    <header>
    </header>
    <main>
        <section class="hero-banner" style="
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;">
            <figure style="margin:0;
            ">
                <img src="image.png" alt="Hero Image" style="
                object-fit: cover;
                position: relative;
                overflow: hidden;
                flex-shrink: 0;
                aspect-ratio: 1/1;
                width: 200px;
                height: 200px;
                ">
            </figure>
        </section>
        <section class="text-container">
            
            <h3 style="
            display: inline-block;
            text-align: center;"
        >Congratulations!</h3>
            <p style="
            width: 100%;
            position: relative;
            text-align: center;
                display: inline-block;">You completed the journey around City Hall station. Such a rocky explorer you are. Keep going with other stations!</p>
        </section>

        <ul id="station-list" style="width: 100%; list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 20px;">

            <section class="option" id="option-3rdstreet" href="#3rdstreet" >
            <img src="1.avif" alt="City Hall" style="aspect-ratio: 1/1; width: auto; height: 64px; position: relative; border-radius: 8px;object-fit: cover;">
            <div style="
                display: flex;
                flex-direction: column;
                gap: 4px;
                flex-grow: 1;
            ">
                <span style="
                    font-size: 10px;
                    line-height: 20px;
                    color: #263d89;
                    text-transform: uppercase;


                ">
                    Estimate 1hr to finish
                </span>
                <p style="
                    text-align: left;
                    font-size: 16px;
                    font-weight: 600;
                    margin: 0;
                ">3rd Street Station</p>

            </div>
            <img class="vuesaxoutlinearrow-right-icon" alt="Arrow Icon" src="vuesax/outline/arrow-right.svg" style="width: 24px; height: 24px;">
            </section>
            <section class="option" id="option-8thstreet" href="#8thstreet">
            <img src="1.avif" alt="City Hall" style="aspect-ratio: 1/1; width: auto; height: 64px; position: relative; border-radius: 8px;object-fit: cover;">
            <div style="
                display: flex;
                flex-direction: column;
                gap: 4px;
                flex-grow: 1;
            ">
                <span style="
                    font-size: 10px;
                    line-height: 20px;
                    color: #263d89;
                    text-transform: uppercase;
                ">
                    Estimate 1hr to finish
                </span>
                <p style="
                    text-align: left;
                    font-size: 16px;
                    font-weight: 600;
                    margin: 0;
                ">8th Street Station</p>

            </div>
            <img class="vuesaxoutlinearrow-right-icon" alt="Arrow Icon" src="vuesax/outline/arrow-right.svg" style="width: 24px; height: 24px;">
            </section>


        </ul>
    </main>
