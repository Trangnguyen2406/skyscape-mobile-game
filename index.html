<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Skyscape</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="icon" href="favicon.png">
    
  </head>
  <body>
        <header>
            
            <img src="Letter_Mark.png" alt="Logo" style="width: auto; height: 24px;">
            
        </header>
    

    <main>
        <section class="hero-banner">
        <figure style="
            margin: 0;
            width: 100%;
            position: relative;
            overflow: hidden;">
          <img src="1.avif" alt="Hero Image">
        </figure>
      </section>
        <section class="text-container">
            <h4 style="
                width: 100%;
                position: relative;
                display: inline-block;
                color: #000;
                text-align: center;">
                Welcome to the journey!
            </h4>
            <p style="
                width: 100%;
                position: relative;
                color: rgba(0, 0, 0, 0.55);
                text-align: center;
                display: inline-block;">Which station do you want to explore?
            </p>
        </section>

        <ul id="station-list" style="width: 100%; list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 20px;">
            <section class="option" id="option-1" href="#city-hall">
            <img src="1.avif" alt="City Hall" style="aspect-ratio: 1/1; width: auto; height: 64px; position: relative; border-radius: 8px;object-fit: cover;">
            <div style="
                display: flex;
                flex-direction: column;
                gap: 4px;
                flex-grow: 1;
            ">
                <span style="
                    color: #263d89;
                    text-transform: uppercase;">Estimate 1hr to finish
                </span>
                <h6>City Hall Station</h6>

            </div>
            <img class="vuesaxoutlinearrow-right-icon" alt="Arrow Icon" src="vuesax/outline/arrow-right.svg" style="width: 24px; height: 24px;">
            </section>
            <section class="option" id="option-2" href="#3rdstreet" >
            <img src="1.avif" alt="City Hall" style="aspect-ratio: 1/1; width: auto; height: 64px; position: relative; border-radius: 8px;object-fit: cover;">
            <div style="
                display: flex;
                flex-direction: column;
                gap: 4px;
                flex-grow: 1;
            ">
                <span style="
                    font-size: 10px;
                    line-height: 20px;
                    color: #263d89;
                    text-transform: uppercase;


                ">
                    Estimate 1hr to finish
                </span>
                <p style="
                    text-align: left;
                    font-size: 16px;
                    font-weight: 600;
                    margin: 0;
                ">3rd Street Station</p>

            </div>
            <img class="vuesaxoutlinearrow-right-icon" alt="Arrow Icon" src="vuesax/outline/arrow-right.svg" style="width: 24px; height: 24px;">
            </section>
            <section class="option" id="option-3" href="#8thstreet">
            <img src="1.avif" alt="City Hall" style="aspect-ratio: 1/1; width: auto; height: 64px; position: relative; border-radius: 8px;object-fit: cover;">
            <div style="
                display: flex;
                flex-direction: column;
                gap: 4px;
                flex-grow: 1;
            ">
                <span style="
                    font-size: 10px;
                    line-height: 20px;
                    color: #263d89;
                    text-transform: uppercase;
                ">
                    Estimate 1hr to finish
                </span>
                <p style="
                    text-align: left;
                    font-size: 16px;
                    font-weight: 600;
                    margin: 0;
                ">8th Street Station</p>

            </div>
            <img class="vuesaxoutlinearrow-right-icon" alt="Arrow Icon" src="vuesax/outline/arrow-right.svg" style="width: 24px; height: 24px;">
            </section>


        </ul>
    </main>
    <footer style="
        width: 100%;
        padding: 16px 0;
        border-top: 1px solid #ededed;
        text-align: center;
        color: #263d89;
    ">
        <img src="footer.png" alt="Logo" style="width: 100px; height: auto;">
    </footer>
